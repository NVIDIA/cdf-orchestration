# AV dataset generation: Curator, CDS, Cosmos3-Nano, and Evaluation.

version: 0.0.1

deployment:
  dag_timeout: 172800 # 2 days

  profiles:
    k8s_gpu_endpoint:
      operator: K8sServiceOperator
      cleanup_operator: K8sCleanupOperator
      pool: k8s_rtx6000_1
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        gpu: true
        image_pull_secrets:
          - ngc-docker-registry-secret
        inference_port: 8000
        health_uri: /health
        deployment_ready_timeout_seconds: 5400
        poll_interval_seconds: 10

    cosmos3_endpoint:
      operator: K8sServiceOperator
      cleanup_operator: K8sCleanupOperator
      pool: k8s_rtx6000_1
      pool_slots: 2
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        gpu: true
        gpu_count: 2
        host_ipc: true
        shm_size: 32Gi
        image_pull_secrets:
          - ngc-docker-registry-secret
        inference_port: 8001
        health_uri: /health
        deployment_ready_timeout_seconds: 5400
        poll_interval_seconds: 10

    k8s_cpu_task:
      operator: K8sTaskOperator
      pool: default_pool
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        startup_timeout_seconds: 900
        image_pull_secrets:
          - ngc-docker-registry-secret

    k8s_gpu_task:
      operator: K8sTaskOperator
      pool: k8s_rtx6000_1
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        startup_timeout_seconds: 900
        gpu: true
        image_pull_secrets:
          - ngc-docker-registry-secret

    k8s_cpu_endpoint:
      operator: K8sServiceOperator
      cleanup_operator: K8sCleanupOperator
      pool: default_pool
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        image_pull_secrets:
          - ngc-docker-registry-secret
        inference_port: 8888
        health_uri: /health
        deployment_ready_timeout_seconds: 1800
        poll_interval_seconds: 10

    augmentation_task:
      operator: K8sTaskOperator
      pool: default_pool
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        startup_timeout_seconds: 900
        gpu: true
        image_pull_secrets:
          - ngc-docker-registry-secret

  components:
    endpoints:
      cosmos_evaluator_postgres:
        container_image: nvcr.io/nvidia/cosmos/database-postgres:2.0.0
        deployment_profile: k8s_cpu_endpoint
        environment:
          POSTGRES_USER: cosmos_eval
          POSTGRES_DB: cosmos_evaluator
        secrets:
          POSTGRES_PASSWORD: local-postgres-password
        configuration:
          inference_port: 5432
          health_protocol: TCP

      cosmos_evaluator_database:
        container_image: nvcr.io/nvidia/cosmos/database:2.0.0
        deployment_profile: k8s_cpu_endpoint
        container_args: >-
          /bin/sh -ec 'for attempt in $(seq 1 60); do
          if getent ahostsv4 {{ ti.xcom_pull(task_ids="wait_for_cosmos_evaluator.startup_cosmos_evaluator_postgres", key="resource_id") }}.sdg-workflow.svc.cluster.local. >/dev/null; then
          exec /usr/local/bin/startup.sh; fi; sleep 2; done;
          echo "PostgreSQL DNS did not become ready" >&2; exit 1'
        environment:
          COSMOS_EVALUATOR_ENV: local
        secrets:
          DATABASE_DB_CONFIG: >-
            {{ {
              "host": ti.xcom_pull(task_ids="wait_for_cosmos_evaluator.startup_cosmos_evaluator_postgres", key="resource_id") ~ ".sdg-workflow.svc.cluster.local.",
              "connect_timeout": 60,
              "port": 5432,
              "database": "cosmos_evaluator",
              "user": "cosmos_eval",
              "password": "local-postgres-password"
            } | tojson }}
          DATABASE_WORKER_KEYS: local-cosmos-evaluator-worker-key
        configuration:
          inference_port: 8000

      cosmos_evaluator_physical_plausibility:
        container_image: nvcr.io/nvidia/cosmos/physical-plausibility-checker:2.0.0
        deployment_profile: k8s_gpu_endpoint
        environment:
          COSMOS_EVALUATOR_ENV: local
          PHYSICAL_PLAUSIBILITY_PROCESS_CONCURRENCY_LIMIT: "4"
          PHYSICAL_PLAUSIBILITY_MAX_BATCH_SIZE: "4"
          PHYSICAL_PLAUSIBILITY_INPUT_STORAGE_TYPE: local
          PHYSICAL_PLAUSIBILITY_OUTPUT_STORAGE_TYPE: local
          PHYSICAL_PLAUSIBILITY_DATABASE_API_URL: >-
            {{ (ti.xcom_pull(task_ids='wait_for_cosmos_evaluator.startup_cosmos_evaluator_database', key='endpoint') or {}).get('url', '') }}
        secrets:
          PHYSICAL_PLAUSIBILITY_DATABASE_WORKER_KEY: local-cosmos-evaluator-worker-key
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
          HF_TOKEN: "{{ var.value.hf_token }}"
        configuration:
          inference_port: 8000

      cosmos_evaluator_arbitrator:
        container_image: nvcr.io/nvidia/cosmos/arbitrator:2.0.0
        deployment_profile: k8s_cpu_endpoint
        environment:
          COSMOS_EVALUATOR_ENV: local
          ARBITRATOR_QUEUE_CAPACITY: "100"
          COSMOS_EVALUATOR_DATABASE_API_URL: >-
            {{ (ti.xcom_pull(task_ids='wait_for_cosmos_evaluator.startup_cosmos_evaluator_database', key='endpoint') or {}).get('url', '') }}
          COSMOS_EVALUATOR_CHECKER_ENDPOINTS: >-
            {{ ti.xcom_pull(task_ids='wait_for_cosmos_evaluator.build_checker_endpoint_map', key='return_value') }}
        configuration:
          inference_port: 8000

      # Cosmos3-Nano video generation.
      cosmos3_service:
        model_cache_pvc: ngc-model-cache
        container_image: vllm/vllm-omni:v0.30.0
        deployment_profile: cosmos3_endpoint
        environment:
          CUDA_DEVICE_ORDER: PCI_BUS_ID
          HF_HOME: "/config/models/paidf-cosmos3"
          NCCL_P2P_DISABLE: "1"
          VLLM_OMNI_VIDEO_SYNC_TIMEOUT: "7200"
          VLLM_OMNI_INPUT_WAIT_TIMEOUT_S: "7200"
        container_args: >-
          vllm serve nvidia/Cosmos3-Nano
          --omni
          --model-class-name Cosmos3OmniDiffusersPipeline
          --stage-overrides '{"0":{"model_config":{"guardrails":false}}}'
          --allowed-local-media-path /
          --cfg-parallel-size 1
          --use-hsdp
          --hsdp-shard-size 2
          --host 0.0.0.0
          --port 8001
          --init-timeout 1800
        configuration:
          inference_port: 8001
          health_uri: /health
          deployment_ready_timeout_seconds: 5400
          shm_size: 32Gi
        secrets:
          HF_TOKEN: "{{ var.value.hf_token }}"

      # Milvus database behind Cosmos Dataset Search.
      milvus_service:
        container_image: milvusdb/milvus:v2.4.0
        deployment_profile: k8s_cpu_endpoint
        environment:
          ETCD_USE_EMBED: "true"
          ETCD_DATA_DIR: /var/lib/milvus/etcd
          ETCD_CONFIG_PATH: /tmp/embedEtcd.yaml
          COMMON_STORAGETYPE: local
        container_args: >-
          bash -c 'printf "listen-client-urls: http://0.0.0.0:2379\nadvertise-client-urls: http://0.0.0.0:2379\nquota-backend-bytes: 4294967296\nauto-compaction-mode: revision\nauto-compaction-retention: \"1000\"\n" > /tmp/embedEtcd.yaml; exec milvus run standalone'
        configuration:
          inference_port: 19530
          health_protocol: TCP
      cds_service:
        container_image: nvcr.io/nvidia/blueprint/cosmos-dataset-search:1.2.0
        deployment_profile: k8s_cpu_endpoint
        container_args: >-
          python -c 'import base64, os, pathlib, sys;
          root = pathlib.Path("/tmp/avdg-cds"); root.mkdir(parents=True, exist_ok=True);
          (root / "bootstrap.py").write_bytes(base64.b64decode(os.environ["CDS_VECTOR_BOOTSTRAP_B64"]));
          (root / "avdg_cds_vectors.py").write_bytes(base64.b64decode(os.environ["CDS_VECTOR_COMPONENTS_B64"]));
          os.environ["PYTHONPATH"] = str(root) + os.pathsep + os.environ.get("PYTHONPATH", "");
          os.execv(sys.executable, [sys.executable, str(root / "bootstrap.py")])'
        environment:
          GUNICORN_PORT: "8888"
          GUNICORN_WORKERS: "1"
          GUNICORN_TIMEOUT: "600"
          VISUAL_SEARCH_LOG_LEVEL: INFO
          ALLOWED_PIPELINES: cosmos_video_search_milvus
          PIPELINES_DIR: /tmp/avdg-cds/pipelines
          MILVUS_DOCUMENT_STORE_URI: >-
            {{ (ti.xcom_pull(task_ids='service_startup.startup_milvus_service', key='endpoint') or {}).get('url', '') }}
          MILVUS_DB: default

    tasks:
      augmentation:
        max_concurrency: 1
        container_image: "{{ var.value.get('avdg_augmentation_image', 'nvcr.io/nvidia/cdf-augmentation:1.2.0') }}"
        deployment_profile: augmentation_task
        environment:
          UV_LINK_MODE: copy
          PYTHONUNBUFFERED: "1"
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
        configuration:
          retries: 0
          execution_timeout_seconds: 22200
          container_resources:
            requests: {cpu: "4", memory: 16Gi}
            limits: {cpu: "16", memory: 64Gi}

      # Cache Cosmos-Embed1 weights before running Curator.
      curator_model_download:
        container_image: nvcr.io/nvidia/cosmos/cosmos-curator:2.3.0
        deployment_profile: k8s_cpu_task
        model_cache_pvc: ngc-model-cache
        environment:
          HF_HOME: "/config/models"
        secrets:
          HF_TOKEN: "{{ var.value.hf_token }}"
        configuration:
          retries: 2
          execution_timeout_seconds: 7200
          container_resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "8", memory: 32Gi}
          container_command: >-
            bash -lc 'set -euo pipefail;
            model_dir=/config/models/nvidia/Cosmos-Embed1-224p;
            ready_file="$model_dir/.cosmos_embed1_224p.ready";
            if test -f "$ready_file" && test -f "$model_dir/processor_config.json"; then
              echo "Cosmos-Embed1-224p is already cached";
              exit 0;
            fi;
            for config_dir in /cosmos_curator/config "$HOME/.config/cosmos_curator"; do
              mkdir -p "$config_dir";
              printf "huggingface:\n    api_key: \"%s\"\n" "$HF_TOKEN" > "$config_dir/config.yaml";
              cp "$config_dir/config.yaml" "$config_dir/cosmos_curator.yaml";
              chmod 600 "$config_dir"/*.yaml;
            done;
            cd /opt/cosmos-curator;
            pixi run -e model-download --as-is python -m cosmos_curator.core.managers.model_cli download --models cosmos_embed1_224p;
            test -f "$model_dir/processor_config.json";
            touch "$ready_file"'

      curator:
        container_image: nvcr.io/nvidia/cosmos/cosmos-curator:2.3.0
        deployment_profile: k8s_gpu_task
        model_cache_pvc: ngc-model-cache
        environment:
          HF_HOME: "/config/models"
          PYTHONUNBUFFERED: "1"
          LD_LIBRARY_PATH: "/opt/ffmpeg/lib"
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
          HF_TOKEN: "{{ var.value.hf_token }}"
          NVIDIA_API_KEY: "{{ conn.nvcf_default.password }}"
        volumes:
          - name: dshm
            mountPath: /dev/shm
            emptyDir:
              medium: Memory
              sizeLimit: 24Gi
          - name: ffmpeg
            mountPath: /opt/ffmpeg
            readOnly: true
            persistentVolumeClaim:
              claimName: shared-ffmpeg
        configuration:
          retries: 1
          execution_timeout_seconds: 86400
          container_resources:
            requests: {cpu: "16", memory: 128Gi}
            limits: {cpu: "32", memory: 192Gi}
          container_command: >-
            bash -lc 'set -euo pipefail;
            mkdir -p /config;
            test -n "${CURATOR_CONFIG_URI:-}" || { echo "CURATOR_CONFIG_URI is not set; build_curator_args did not provide a config path." >&2; exit 1; };
            printf "%s" "$MSC_CREDENTIALS_SCRIPT_B64" | base64 -d > /tmp/msc_credentials.py;
            cd /opt/cosmos-curator;
            test -x /opt/ffmpeg/bin/ffmpeg && test -x /opt/ffmpeg/bin/ffprobe || { echo "No shared FFmpeg installation at /opt/ffmpeg. Fill the shared-ffmpeg claim on this cluster as described in docs/autonomous-vehicle-dataset-generation/getting-started.md." >&2; exit 1; };
            export PATH="/opt/ffmpeg/bin:$PATH";
            pixi run -e legacy-transformers --as-is python -c "import av, sys, logging; logging.basicConfig(level=logging.INFO); logger = logging.getLogger(\"curator_preflight\"); logger.info(\"PyAV %s %s\", av.__version__, av.library_versions); sys.exit(0 if \"h264\" in av.codecs_available else 1)" || { echo "PyAV in the Curator environment cannot decode H.264. The cosmos-curator-ffmpeg sidecar must hold an FFmpeg 8.1 build with an H.264 decoder; refill it as described in docs/autonomous-vehicle-dataset-generation/getting-started.md." >&2; exit 1; };
            pixi run -e "${PIXI_ENV:-default}" --as-is python /tmp/msc_credentials.py --write-s3-profile;
            pixi run -e "${PIXI_ENV:-default}" --as-is python /tmp/msc_credentials.py --download "$CURATOR_CONFIG_URI" --dest /config/pipeline_config.yaml;
            SECONDS=0;
            if [ -n "${QUERY_CURATOR_CONFIG_URI:-}" ]; then
              echo "Embedding the query video with Cosmos Curator";
              pixi run -e "${PIXI_ENV:-default}" --as-is python /tmp/msc_credentials.py --download "$QUERY_CURATOR_CONFIG_URI" --dest /config/query_pipeline_config.yaml;
              pixi run -e "${PIXI_ENV:-default}" --as-is python -m cosmos_curator.pipelines.video.run_pipeline /config/query_pipeline_config.yaml;
            fi;
            echo "Processing the dataset with Cosmos Curator";
            pixi run -e "${PIXI_ENV:-default}" --as-is
            python -m cosmos_curator.pipelines.video.run_pipeline /config/pipeline_config.yaml;
            pixi run -e "${PIXI_ENV:-default}" --as-is python /tmp/msc_credentials.py --write-curator-timing "$SECONDS"'

      # Ingest Curator embeddings into CDS and run the requested search.
      cds_ingest:
        container_image: nvcr.io/nvidia/blueprint/cosmos-dataset-search:1.2.0
        deployment_profile: k8s_cpu_task
        environment:
          PYTHONUNBUFFERED: "1"
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
        configuration:
          retries: 0
          execution_timeout_seconds: 7200
          container_resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "8", memory: 32Gi}
          container_command: >-
            bash -lc 'set -euo pipefail;
            printf "%s" "$MSC_CREDENTIALS_SCRIPT_B64" | base64 -d > /tmp/msc_credentials.py;
            printf "%s" "$CDS_INGEST_SCRIPT_B64" | base64 -d > /tmp/cds_ingest.py;
            exec python3 /tmp/cds_ingest.py'

      # Full-decode validation of WSM controls and generated videos.
      media_probe:
        container_image: nvcr.io/nvidia/cosmos/cosmos-curator:2.3.0
        deployment_profile: k8s_cpu_task
        environment:
          PYTHONUNBUFFERED: "1"
          LD_LIBRARY_PATH: "/opt/ffmpeg/lib"
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
        volumes:
          - name: ffmpeg
            mountPath: /opt/ffmpeg
            readOnly: true
            persistentVolumeClaim:
              claimName: shared-ffmpeg
        configuration:
          retries: 1
          execution_timeout_seconds: 3600
          container_resources:
            requests: {cpu: "2", memory: 8Gi}
            limits: {cpu: "8", memory: 16Gi}
          container_command: >-
            bash -lc 'set -euo pipefail;
            test -x /opt/ffmpeg/bin/ffmpeg && test -x /opt/ffmpeg/bin/ffprobe || { echo "No shared FFmpeg installation at /opt/ffmpeg. Fill the shared-ffmpeg claim on this cluster as described in docs/autonomous-vehicle-dataset-generation/getting-started.md." >&2; exit 1; };
            export PATH="/opt/ffmpeg/bin:$PATH";
            printf "%s" "$MSC_CREDENTIALS_SCRIPT_B64" | base64 -d > /tmp/msc_credentials.py;
            printf "%s" "$MEDIA_PROBE_SCRIPT_B64" | base64 -d > /tmp/media_probe.py;
            printf "%s" "$CONTROL_VIDEO_PROBE_SCRIPT_B64" | base64 -d > /tmp/control_video_probe.py;
            cd /opt/cosmos-curator;
            exec pixi run -e "${PIXI_ENV:-default}" --as-is python "/tmp/$PROBE_SCRIPT"'
