version: 0.0.1
deployment:
  # 200 images = 20 chunks. Cloud VLM: 1 GPU per chunk; local Gemma: 2 GPUs per chunk.
  dag_timeout: 86400
  profiles:
    k8s_anomalygen_local_task: &anomalygen_profile
      pool: k8s_rtx6000_1
      pool_slots: 2
      operator: K8sTaskOperator
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        startup_timeout_seconds: 900
        gpu: true
        image_pull_secrets:
        - ngc-docker-registry-secret
    k8s_anomalygen_cloud_task:
      <<: *anomalygen_profile
      pool_slots: 1
  components:
    tasks:
      aoi_anomaly_generation: &anomalygen_task
        enabled: true
        container_image: nvcr.io/nvidia/cdf-anomalygen:1.2.0
        deployment_profile: k8s_anomalygen_cloud_task
        environment:
          LOG_LEVEL: INFO
          HOME: /tmp
          PYTHONUNBUFFERED: '1'
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: '{{ var.value.multistorageclient_configuration_secret }}'
          HF_TOKEN: '{{ var.value.hf_token }}'
          # GPT-6 Astra (NVIDIA inference gateway) token, VLM_API_KEY in secrets.env.
          VLM_API_KEY: "{{ var.value.get('vlm_api_key', '') }}"
        volumes:
        - name: anomalygen-checkpoints
          mountPath: /workspace/cdf-anomalygen/checkpoints
          subPath: checkpoints
          persistentVolumeClaim:
            claimName: ngc-model-cache
        - name: dshm
          mountPath: /dev/shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
        - name: anomalygen-work
          mountPath: /work
          emptyDir:
            sizeLimit: 64Gi
        configuration:
          retries: 0
          execution_timeout_seconds: 10800
          # Runs run_pipeline (prepare, amg, generate, export, publish), then AnomalyGen evaluate
          # on the generated batch (after publish, so a scoring failure cannot lose the images),
          # then uploads what AnomalyGen publish leaves behind (masks, kpi.json, generation CSV,
          # amg testcases, logs) into the same chunk folder, stage_timing.json last. Exit code is
          # run_pipeline's; evaluate and upload problems are recorded in stage_timing.json.
          # No single quotes inside the program: shlex splits this command.
          container_command: |-
            python -c '
            import base64, datetime, json, os, pathlib, shutil, subprocess, sys
            cfg = json.loads(base64.b64decode(os.environ["AOI_RUN_CONFIG_B64"]))
            evaluate = os.environ.get("AOI_EVALUATE", "1") == "1"
            dest = cfg["staging"]["publish"]["output"].rstrip("/")
            out = pathlib.Path(cfg["output"])
            endpoints = json.loads(base64.b64decode(os.environ.get("AOI_AMG_ENDPOINTS_B64") or "W10="))
            if endpoints:
                key = os.environ.get("VLM_API_KEY")
                if not key:
                    raise SystemExit("VLM_API_KEY (Airflow Variable vlm_api_key) is required for amg_endpoints")
                for endpoint in endpoints:
                    endpoint["key"] = key
                fd = os.open(cfg["amg_model_registry"], os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
                with os.fdopen(fd, "w") as registry:
                    json.dump(endpoints, registry)
            pathlib.Path("/work/run.yaml").write_text(json.dumps(cfg))
            def now():
                return datetime.datetime.now(datetime.timezone.utc)
            def stamp(line):
                try:
                    head = line.split("[", 1)[1].split("|", 1)[0]
                    t = datetime.datetime.strptime(str(now().year) + "-" + head, "%Y-%m-%d %H:%M:%S")
                    return t.replace(tzinfo=datetime.timezone.utc)
                except Exception:
                    return now()
            def stream(cmd, log=None):
                fh = open(log, "w") if log else None
                proc = subprocess.Popen(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, bufsize=1)
                for line in proc.stdout:
                    sys.stdout.write(line)
                    sys.stdout.flush()
                    if fh:
                        fh.write(line)
                    yield line
                if fh:
                    fh.close()
                stream.rc = proc.wait()
            started = now()
            marks = []
            for line in stream([sys.executable, "-u", "-m", "anomalygen.scripts.run_pipeline", "--config", "/work/run.yaml"]):
                text = line.rstrip()
                if "run_pipeline.py" in text and "] === " in text and text.endswith(" ==="):
                    marks.append((text[:-4].rsplit("] === ", 1)[1], stamp(text)))
            rc = stream.rc
            pipeline_end = now()
            stages = {}
            for i, (name, start) in enumerate(marks):
                end = marks[i + 1][1] if i + 1 < len(marks) else pipeline_end
                stages[name] = round((end - start).total_seconds(), 1)
            sdg = out / "sdg"
            eval_rc = None
            if rc == 0 and evaluate:
                print("[aoi] === evaluate (after publish) ===", flush=True)
                t0 = now()
                (out / "logs").mkdir(parents=True, exist_ok=True)
                cmd = [sys.executable, "-u", "-m", "anomalygen.scripts.texture.evaluate", "--gen_root", str(sdg),
                       "--real_root", cfg["input"], "--recipe", cfg["recipe"], "--output_file", str(sdg / "kpi.json")]
                for _ in stream(cmd, out / "logs" / "evaluate.log"):
                    pass
                eval_rc = stream.rc
                stages["evaluate"] = round((now() - t0).total_seconds(), 1)
            finished = now()
            extras = pathlib.Path("/work/extras")
            extras.mkdir(parents=True, exist_ok=True)
            def keep(src, rel):
                src = pathlib.Path(src)
                if src.is_file():
                    target = extras / rel
                    target.parent.mkdir(parents=True, exist_ok=True)
                    shutil.copy2(src, target)
            for log in sorted((out / "logs").glob("*.log")):
                keep(log, "logs/" + log.name)
            if rc == 0:
                manifest = out / "export" / "export_manifest.json"
                if manifest.is_file():
                    m = json.loads(manifest.read_text())
                    root = pathlib.Path(m.get("source_bucket") or sdg)
                    for published, internal in m.get("images", {}).items():
                        keep(root / "original_mask" / internal, "masks/" + published)
                keep(sdg / "kpi.json", "kpi.json")
                keep(sdg / "texture_ft_generation_result.csv", "generation/texture_ft_generation_result.csv")
                keep(sdg / "timing_summary.json", "generation/timing_summary.json")
                keep(sdg / "guardrail_blocked.csv", "generation/guardrail_blocked.csv")
                keep(out / "amg" / "testcase.jsonl", "amg/testcase.jsonl")
                keep(out / "pipeline_config.resolved.yaml", "pipeline_config.resolved.yaml")
            from anomalygen.staging import store
            store.configure()
            errors = []
            files = sorted(p for p in extras.rglob("*") if p.is_file())
            for p in files:
                try:
                    store.upload(p, store.join(dest, p.relative_to(extras).as_posix()))
                except Exception as exc:
                    errors.append(p.relative_to(extras).as_posix() + ": " + str(exc)[:300])
            timing = {"exit_code": rc, "evaluate_exit_code": eval_rc, "started_at": started.isoformat(),
                      "finished_at": finished.isoformat(), "total_seconds": round((finished - started).total_seconds(), 1),
                      "stages_seconds": stages, "uploaded_files": len(files) - len(errors), "upload_errors": errors}
            (extras / "stage_timing.json").write_text(json.dumps(timing, indent=1) + "\n")
            store.upload(extras / "stage_timing.json", store.join(dest, "stage_timing.json"))
            print("[aoi] uploaded " + str(len(files) - len(errors)) + " file(s) + stage_timing.json to " + dest + "; " + json.dumps(timing), flush=True)
            sys.exit(rc)
            '
      aoi_anomaly_generation_local:
        <<: *anomalygen_task
        deployment_profile: k8s_anomalygen_local_task
