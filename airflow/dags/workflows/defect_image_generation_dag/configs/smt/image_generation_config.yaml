# artix-dc-scm — airflow handoff: top-side SMT capture
#
# Scope   : component captures select the 24 ICs in the Artix board metadata.
# Solder  : Surface Evolver joints generated only for the explicit refdes allowlist.
# Masks   : selected component bodies plus their pin/pad geometry.
# Output  : 10 K x 8 K full-board RGB/semantic stitches and 24 paired IC crops.
#
# Board size is 90 x 120.405 mm. With the -90-degree top-camera rotation, an
# exact long-edge-10-K image would be about 10000 x 7475. Fixed 2000-square
# tiles require a whole grid, so 5 x 4 produces the nearest practical size:
# 10000 x 8000.
#
# Solder and annotations use the top-side SMT allowlist; focused captures select
# the `ic` component type directly from the board metadata.
api_version: 1.0.0
domain: pcb-aoi
random_seed: 0

output_dir: ./output/airflow-artix-smt-top

scene:
  # The DAG fills scene.usd from payload.input_scene and sets output_dir per run.
  usd: <input_scene>
  root: /Board
  # Initializes the embedded USD metadata catalog.
  components: {}

appearance:
  lighting:
    mode: white_light
    preserve_scene_light_color: false
    exposure: 0.0
    cone_angle: 120.0
    cone_softness: 1.0
    dome:
      intensity: 1000.0
      visible: true
  vantablack_components: false

operations:
  solder_joints:
    solver: surface_evolver
    options:
      # Exact refdes allowlist: every top-side SMT component.
      components: &target_refdes
        [C1, C2, C3, C4, C5, C6, C7, C8, C9, C14, C15, C16, C17, C27,
         C28, C29, C30, C31, C32, C33, C34, C39, C40, C41, C42, C44, C46,
         C47, C48, C49, C50, C51, C52, C53, C54, C55, C56, C57, C58, C59,
         C60, C61, C62, C64, C65, C66, C67, C68, C69, C70, C71, C72, C73,
         C74, C75, C76, C77, C78, C79, C80, C81, C82, C83, C84, C85, C86,
         C87, C88, C89, C90, C101, C103, C107, C149, C150, C151, C154,
         C166, C168, C169, C170, C172, C173, C174, C176, C179, C180,
         C181, C182, C220, C233, C250, C251, C252, C253, C254, D1, D2,
         D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15, F1,
         FB1, J3, J5, J8, J10, L1, L2, L3, L4, L5, L6, PROG_B1, Q6, Q14,
         Q15, Q16, R3, R4, R5, R6, R7, R8, R10, R11, R12, R13, R14, R15,
         R16, R17, R18, R19, R20, R45, R46, R47, R48, R49, R50, R51, R52,
         R53, R57, R58, R59, R60, R62, R66, R67, R68, R69, R70, R71, R72,
         R73, R74, R75, R76, R77, R78, R79, R80, R81, R84, R94, R95, R96,
         R97, R98, R113, R114, R130, R131, R132, R136, R137, R138, R139,
         R140, R141, R142, R144, R145, R146, R147, R157, R158, R160,
         R185, R186, R187, R188, R189, R190, R191, R192, R193, R194,
         R195, R196, R197, U1, U2, U3, U4, U5, U6, U7, U8, U9, U10, U11,
         U12, U13, U14, U15, U16, U17, U18, U19, U20, U22, U23, U24, U25,
         Y1, Y2]
      # Use the board's rougher metallic paste material instead of the shinier
      # packaged generated-solder material.
      solder_material_prim_path: /Board/Looks/SolderPaste

annotations:
  components: true
  component_classes:
    smt: *target_refdes
  geometry:
    solder: solder
    terminals: pin
    pads: pad
    components: *target_refdes

capture:
  passes:
    # 5 x 4 square tiles stitch to 10000 x 8000.
    full_board:
      renderer:
        mode: pathtracing
        resolution: [2000, 2000]
        spp: 1
        total_spp: 32
        max_bounces: 4
      camera:
        side: top
        rotation: {x: 0.0, y: 0.0, z: -90.0}
      scan_grid: [5, 4]
      limits: {triggers: 1, max_images: 20}
      outputs:
        annotators: [rgb]
        frame_padding: 4
        rename_to_grid_index: true

    # Pixel-aligned semantic tiles matching full_board.
    full_board_roi:
      renderer:
        mode: pathtracing
        resolution: [2000, 2000]
        spp: 1
        total_spp: 32
        max_bounces: 4
      camera:
        side: top
        rotation: {x: 0.0, y: 0.0, z: -90.0}
      scan_grid: [5, 4]
      limits: {triggers: 1, max_images: 20}
      outputs:
        annotators: [semantic_segmentation]
        semantic_types: [class]
        colorize: [semantic_segmentation]
        frame_padding: 4
        rename_to_grid_index: true

    component_focus:
      renderer:
        mode: pathtracing
        resolution: [512, 512]
        spp: 1
        total_spp: 32
        max_bounces: 4
      camera:
        side: top
        rotation: {x: 0.0, y: 0.0, z: -90.0}
      scan_grid: [1, 1]
      limits: {triggers: 1, max_images: 24}
      roi_selection:
        - component_types: [ic]
          # This board has 24 ICs; an omitted type-selector count selects only one.
          count: 24
          padding: 0.5
      outputs:
        annotators: [rgb]
        frame_padding: 4

    # Segmentation-mask counterpart to component_focus.
    component_focus_roi:
      renderer:
        mode: pathtracing
        resolution: [512, 512]
        spp: 1
        total_spp: 32
        max_bounces: 4
      camera:
        side: top
        rotation: {x: 0.0, y: 0.0, z: -90.0}
      scan_grid: [1, 1]
      limits: {triggers: 1, max_images: 24}
      roi_selection:
        - component_types: [ic]
          count: 24
          padding: 0.5
      outputs:
        annotators: [semantic_segmentation]
        semantic_types: [class]
        colorize: [semantic_segmentation]
        frame_padding: 4

execution:
  serialization_path: ./output/airflow-artix-smt-top/stage.usda

postprocess:
  stitch:
    - source_pass: full_board
      image_type: rgb
      output_subdir: stitched
      output_filename: rgb_10k_x_8k.png
      blend: none
    - source_pass: full_board_roi
      image_type: semantic_segmentation
      output_subdir: stitched
      output_filename: semantic_10k_x_8k.png
      blend: labels
