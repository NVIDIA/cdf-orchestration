data:
  - inputs:
      rgb: <> # This field is filled in by Airflow
    output:
      prefix: <> # Airflow fills the candidate-relative storage prefix
      video: <> # This field is filled in by Airflow
      caption: <> # This field is filled in by Airflow
      metadata: <> # This field is filled in by Airflow

endpoints:
  - id: vlm
    role: vlm
    url: <> # This field is filled in by Airflow
    model: <> # This field is filled in by Airflow
    timeout: 120
  - id: llm
    role: llm
    url: <> # This field is filled in by Airflow
    model: <> # This field is filled in by Airflow
    timeout: 120
  - id: image_edit
    role: image_edit
    url: <> # This field is filled in by Airflow
    model: <> # This field is filled in by Airflow
    adapter: openai.chat.completions
    api_key_env: BUILD_NVIDIA_API_KEY
    timeout: 200
  - id: cosmos_evaluator
    role: evaluator
    url: <> # Airflow fills the managed or external Arbitrator root URL
    adapter: cosmos.evaluator.arbitrator
    timeout: 1800

pipeline:
  retry: 0
  logging:
    enabled: true
    level: "INFO"

captioning:
  llm:
    endpoint_id: llm
    text: "Change the person's clothing to a {top_outer_color} {top_outer_type}, with {bottom_color} {bottom_type}, and {shoe_color} {shoe_type}. The person's clothing and appearance is identical in all views."
    variables:
      top_outer_color: ["beige"]
      top_outer_type: ["hoodie"]
      bottom_type: ["jeans"]
      bottom_color: ["black"]
      shoe_type: ["sneakers"]
      shoe_color: ["white"]
    verification_options:
      top_outer_color: ["beige", "black", "blue", "brown", "camouflage", "green", "grey", "orange", "pink", "purple", "red", "white", "yellow"]
      top_outer_type: ["camisole", "knee-length coat", "hoodie", "cropped jacket", "robe", "sweater", "vest"]
      bottom_type: ["dress", "leggings", "jeans", "shorts", "skirt"]
      bottom_color: ["beige", "black", "blue", "brown", "camouflage", "green", "grey", "orange", "pink", "purple", "red", "white", "yellow"]
      shoe_type: ["barefoot", "boots", "flip-flops", "high heels", "sandals", "sneakers"]
      shoe_color: ["none", "beige", "black", "blue", "brown", "green", "grey", "orange", "pink", "purple", "red", "white", "yellow"]

augmentation:
  model:
    name: "image-edit"
  parameters:
    extra_body:
      num_inference_steps: 50
      guidance_scale: 1.0
      seed: null

evaluators:
  - cosmos_evaluator:
      enabled: true
      endpoint_id: cosmos_evaluator
      poll_interval_seconds: 5
      output_storage_prefix: "${data.0.output.prefix}/cosmos-evaluator/"
      checks:
        - name: metropolis.attribute_verification
          gate: true
          metadata_key: attribute_verification
      config:
        selected_variables: {} # Airflow fills the sampled verification values
        variable_options: {} # Airflow copies captioning.llm.verification_options
        question_generation:
          llm:
            endpoint: "${endpoints.1.url}"
            model: "${endpoints.1.model}"
          system_prompt: |
            You are an expert at creating multiple choice verification questions for human attributes.
            The images you analyze always contain a single person with one or multiple views of that same person.
            Your task is to generate a simple, direct question that can verify a specific attribute about the person.
            The question must have 2-4 answer options and test for a specific visual attribute.
            The question should be answerable by looking at a single view of the person even if there are multiple views.
            CRITICAL: Each question MUST explicitly name which clothing/attribute is being asked about. Do not use vague wording like "What type of top?" - instead specify exactly which attribute, e.g. "outer layer type (shirt, jacket, etc.)", "inner layer color", "bottom type (pants/skirt)", "shoe type", "shoe color". This avoids ambiguity between inner vs outer layer, top vs bottom, etc.
            CRITICAL: Distractor options must be clearly distinct from the correct answer. Do not include visually or semantically overlapping options in the same MCQ. For example, if the target/fine-grained color is "olive brown", do not offer both "olive" and "brown"; choose one as the correct answer and use clearly different colors as distractors. For bottom type, avoid ambiguous pairs like "dress" and "skirt" in the same question when one is the correct answer.
            Output your response as a single JSON object with no additional text or formatting.
          parameters:
            retry: 1
            temperature: 0.2
            top_p: 0.95
            frequency_penalty: 0.0
            presence_penalty: 0.0
            max_tokens: 2048
            stream: true
        vlm_verification:
          vlm:
            endpoint: "${endpoints.0.url}"
            model: "${endpoints.0.model}"
          system_prompt: |
            You are an expert vision model tasked with answering multiple choice questions about images of humans.
            The images may have one or multiple views of the same person.
            Analyze the image carefully and select the single best answer from the provided options.
            Respond with ONLY a single letter (A, B, C, or D) corresponding to your answer.
            Do not include any explanation or additional text.
          parameters:
            retry: 5
            temperature: 1.0
            top_p: 1.0
            frequency_penalty: 0.0
            max_tokens: 256
            stream: false
