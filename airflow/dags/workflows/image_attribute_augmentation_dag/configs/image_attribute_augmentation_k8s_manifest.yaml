# K8s Manifest for Remote GPU Cluster
#
# This manifest targets a remote Kubernetes cluster with RTX PRO 6000 GPU(s).
# It uses kubernetes_conn_id to connect to the remote cluster instead of
# the local in-cluster config.
#
# Kubernetes access uses the tbot-managed kubeconfig on kubernetes_conn_id.
# Do not set a static `context`; tbot names the kubeconfig current-context.

version: 0.0.1

deployment:
  dag_timeout: 172800 # 2 days

  profiles:
    k8s_cpu_endpoint:
      operator: K8sServiceOperator
      cleanup_operator: K8sCleanupOperator
      pool: default_pool
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        image_pull_secrets:
          - ngc-docker-registry-secret

    k8s_cpu_task:
      operator: K8sTaskOperator
      pool: default_pool
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        startup_timeout_seconds: 900
        image_pull_secrets:
          - ngc-docker-registry-secret

    k8s_gpu_endpoint:
      operator: K8sServiceOperator
      cleanup_operator: K8sCleanupOperator
      pool: k8s_rtx6000_1
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        gpu: true
        model_cache_pvc: ngc-model-cache
        image_pull_secrets:
          - ngc-docker-registry-secret
        inference_port: 8000
        health_uri: /health
        deployment_ready_timeout_seconds: 5400
        poll_interval_seconds: 10

    k8s_gpu_task:
      operator: K8sTaskOperator
      pool: k8s_rtx6000_1
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        startup_timeout_seconds: 900
        gpu: true
        image_pull_secrets:
          - ngc-docker-registry-secret

    augmentation_task:
      operator: K8sTaskOperator
      pool: default_pool
      pool_slots: 1
      configuration:
        namespace: sdg-workflow
        in_cluster: true
        startup_timeout_seconds: 900
        image_pull_secrets:
          - ngc-docker-registry-secret

  components:
    endpoints:
      cosmos_evaluator_postgres:
        container_image: nvcr.io/nvidia/cosmos/database-postgres:2.0.0
        deployment_profile: k8s_cpu_endpoint
        environment:
          POSTGRES_USER: cosmos_eval
          POSTGRES_DB: cosmos_evaluator
        secrets:
          POSTGRES_PASSWORD: local-postgres-password
        configuration:
          inference_port: 5432
          health_protocol: TCP

      cosmos_evaluator_database:
        container_image: nvcr.io/nvidia/cosmos/database:2.0.0
        deployment_profile: k8s_cpu_endpoint
        environment:
          COSMOS_EVALUATOR_ENV: local
        secrets:
          DATABASE_DB_CONFIG: >-
            {{ {
              "host": ti.xcom_pull(task_ids="wait_for_cosmos_evaluator.startup_cosmos_evaluator_postgres", key="resource_id") ~ ".sdg-workflow.svc.cluster.local",
              "port": 5432,
              "database": "cosmos_evaluator",
              "user": "cosmos_eval",
              "password": "local-postgres-password"
            } | tojson }}
          DATABASE_WORKER_KEYS: local-cosmos-evaluator-worker-key
        configuration:
          inference_port: 8000

      cosmos_evaluator_attribute_verification:
        container_image: nvcr.io/nvidia/cosmos/attribute-verification-checker:2.0.0
        deployment_profile: k8s_cpu_endpoint
        environment:
          COSMOS_EVALUATOR_ENV: local
          ATTRIBUTE_VERIFICATION_PROCESS_CONCURRENCY_LIMIT: "4"
          ATTRIBUTE_VERIFICATION_INPUT_STORAGE_TYPE: local
          ATTRIBUTE_VERIFICATION_OUTPUT_STORAGE_TYPE: local
          ATTRIBUTE_VERIFICATION_DATABASE_API_URL: >-
            {{ (ti.xcom_pull(task_ids='wait_for_cosmos_evaluator.startup_cosmos_evaluator_database', key='endpoint') or {}).get('url', '') }}
        secrets:
          ATTRIBUTE_VERIFICATION_DATABASE_WORKER_KEY: local-cosmos-evaluator-worker-key
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
          BUILD_NVIDIA_API_KEY: "{{ conn.nvcf_default.password }}"
        configuration:
          inference_port: 8000

      cosmos_evaluator_arbitrator:
        container_image: nvcr.io/nvidia/cosmos/arbitrator:2.0.0
        deployment_profile: k8s_cpu_endpoint
        environment:
          COSMOS_EVALUATOR_ENV: local
          ARBITRATOR_QUEUE_CAPACITY: "100"
          COSMOS_EVALUATOR_DATABASE_API_URL: >-
            {{ (ti.xcom_pull(task_ids='wait_for_cosmos_evaluator.startup_cosmos_evaluator_database', key='endpoint') or {}).get('url', '') }}
          COSMOS_EVALUATOR_CHECKER_ENDPOINTS: >-
            {{ ti.xcom_pull(task_ids='wait_for_cosmos_evaluator.build_checker_endpoint_map', key='return_value') }}
        configuration:
          inference_port: 8000

      # Qwen3.8-27B-FP8 — shared VLM/LLM served from Hugging Face
      vlm_service:
        container_image: nvcr.io/nvidia/vllm:26.05.post1-py3
        deployment_profile: k8s_gpu_endpoint
        environment:
          HF_HOME: "/config/models"
        container_args: >-
          vllm serve Qwen/Qwen3.8-27B-FP8
          --host 0.0.0.0 --port 8000
          --trust-remote-code --max-model-len 32768 --dtype auto
          --max-num-seqs 512
        configuration:
          inference_port: 8000
          health_uri: /health
        secrets:
          HUGGING_FACE_HUB_TOKEN: "{{ var.value.hf_token }}"
          HF_TOKEN: "{{ var.value.hf_token }}"

      # Qwen-Image-Edit-2511 — image edit
      image_edit_service:
        container_image: vllm/vllm-omni:v0.20.0
        deployment_profile: k8s_gpu_endpoint
        environment:
          HF_HOME: "/config/models"
        container_args: vllm-omni serve Qwen/Qwen-Image-Edit-2511 --omni --port 8000
        configuration:
          inference_port: 8000
          health_uri: /health
        secrets:
          HUGGING_FACE_HUB_TOKEN: "{{ var.value.hf_token }}"
          HF_TOKEN: "{{ var.value.hf_token }}"

    tasks:
      event_and_person_attribute_search:
        container_image: nvcr.io/nvidia/cdf-event-and-person-attribute-search-service:1.1.0
        deployment_profile: k8s_cpu_task
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
          NVIDIA_API_KEY: "{{ conn.nvcf_default.password }}"
        configuration:
          retries: 3

      augmentation:
        max_concurrency: 2
        container_image: nvcr.io/nvidia/cdf-augmentation:1.2.0
        deployment_profile: augmentation_task
        environment:
          UV_LINK_MODE: copy
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
          BUILD_NVIDIA_API_KEY: "{{ conn.nvcf_default.password }}"
          NVIDIA_API_KEY: "{{ conn.nvcf_default.password }}"
          VLM_API_KEY: "{{ conn.nvcf_default.password }}"
          LLM_API_KEY: "{{ conn.nvcf_default.password }}"
          IMAGE_EDIT_API_KEY: "{{ conn.nvcf_default.password }}"
          COSMOS_API_KEY: "{{ conn.nvcf_default.password }}"
        configuration:
          retries: 3

      cosmos_post_processing:
        container_image: nvcr.io/nvidia/cdf-augmentation:1.2.0
        deployment_profile: k8s_cpu_task
        secrets:
          MULTISTORAGECLIENT_CONFIGURATION: "{{ var.value.multistorageclient_configuration_secret }}"
          VLM_API_KEY: "{{ conn.nvcf_default.password }}"
        configuration:
          retries: 3
          container_command: "bash -c 'cd /workspace && exec uv \"$@\"' _"
