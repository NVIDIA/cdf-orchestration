# Cosmos3-Nano transfer through vLLM-Omni's asynchronous video API.
#
# The async create -> poll -> download contract keeps every individual HTTP
# request short, so a hosted gateway cannot time the run out mid-generation the
# way it does on the single long-lived /v1/videos/sync request.

data:
  - inputs:
      rgb: <> # This field is filled in by Airflow
    output:
      prefix: <> # Airflow fills the candidate-relative storage prefix
      video: <> # This field is filled in by Airflow
      caption: <> # This field is filled in by Airflow
      metadata: <> # This field is filled in by Airflow

endpoints:
  - id: vlm
    role: vlm
    url: <> # This field is filled in by Airflow
    model: <> # This field is filled in by Airflow
  - id: llm
    role: llm
    url: <> # This field is filled in by Airflow
    model: <> # This field is filled in by Airflow
  - id: cosmos_transfer
    role: video_transfer
    url: <> # This field is filled in by Airflow
    model: nvidia/Cosmos3-Nano
    adapter: openai.video.async
    timeout: 7200
  - id: cosmos_evaluator
    role: evaluator
    url: <> # Airflow fills the run-scoped K8s Arbitrator root URL
    adapter: cosmos.evaluator.arbitrator
    timeout: 1800

pipeline:
  retry: 0
  regenerate_caption_on_retry: true
  logging:
    enabled: true
    level: "INFO"

captioning:
  vlm:
    parser: "instruct"
    system_prompt: |
      You are a helpful assistant that describes video scenes.
      You MUST ONLY describe the scene content itself, never the video quality
      or technical aspects. Respond with plain descriptive text only.
    user_prompt: >
      Describe this traffic intersection surveillance footage.
      Focus on weather conditions, time of day and lighting, road conditions
      and markings, vehicles present, pedestrians, traffic signals, buildings,
      and other physical scene elements. If you cannot see something clearly,
      simply don't mention it. Describe only the scene content.
    parameters:
      temperature: 0.3
      top_p: 0.95
      frequency_penalty: 1.05
      max_tokens: 4096
      stream: false
      fps: 4.0
      max_pixels: 307200

  llm:
    system_prompt: |
      You are an expert at writing concise prompts for a video generation model.
      You are given:
      1. A caption describing the source traffic scene.
      2. Attribute-value pairs describing the desired target conditions.
      Generate a single natural-language prompt that changes the scene to match the
      target attributes while preserving viewpoint, scene layout, vehicle motion,
      and object consistency.
      State the target attributes first, and never mention source attribute values
      that conflict with them. For a cloudy target, explicitly describe a fully
      overcast sky with no visible sun, blue sky, direct sunlight, or hard shadows.
      Output only a JSON object with a single key "prompt" containing the final sentence.
    parameters:
      temperature: 0.3
      top_p: 0.95
      max_tokens: 4096
      frequency_penalty: 1.05
      presence_penalty: 0
      stream: false

augmentation:
  model:
    name: "cosmos_transfer"
    version: "nano-transfer"

  parameters:
    size: 1280x720
    num_frames: 93
    fps: 30
    num_inference_steps: 50
    guidance_scale: 5.0
    flow_shift: 10.0
    seed: null
    extra_params:
      edge:
        preset_edge_threshold: high
      resolution: "720"
      control_guidance: 1.2
      guardrails: false
      use_resolution_template: false
      use_duration_template: false
      num_conditional_frames: 1
      num_first_chunk_conditional_frames: 0
      share_vision_temporal_positions: true
      num_video_frames_per_chunk: 93
      max_frames: 93
    negative_prompt: >-
      daytime, daylight, sunlight, sunny, bright sun, harsh sun shadows,
      blue daytime sky, overcast day, dusk, twilight, bright ambient daylight,
      flat washed out lighting, sunlit pavement, bare dry asphalt,
      green summer foliage, fire, flames, embers, warped geometry,
      distorted layout, objects moving or vanishing, low quality,
      compression artifacts, temporal flicker, morphing, jerky motion,
      swimming textures, blurry muddy textures, color banding.

evaluators:
  - cosmos_evaluator:
      enabled: true
      endpoint_id: cosmos_evaluator
      poll_interval_seconds: 5
      output_storage_prefix: "${data.0.output.prefix}/cosmos-evaluator/"
      inputs:
        original_video_urls:
          output: "${data.0.inputs.rgb}"
      checks:
        - name: metropolis.hallucination
          gate: true
          metadata_key: hallucination_check
        - name: metropolis.attribute_verification
          gate: true
          metadata_key: attribute_verification
        - name: metropolis.physical_plausibility
          gate: true
          metadata_key: physical_plausibility
      config:
        selected_variables: {} # Airflow fills the sampled values
        question_generation:
          llm:
            endpoint: "${endpoints.1.url}"
            model: "${endpoints.1.model}"
          system_prompt: |
            You are an expert at creating multiple choice verification questions.
            Your task is to generate a simple, direct question that can verify a
            specific attribute in a video frame. The question must have 2-4 answer
            options and test for a specific visual attribute. The question should be
            answerable by looking at a single frame from the video.
            Output your response as a single JSON object with no additional text or formatting.
          parameters:
            retry: 1
            temperature: 0.2
            top_p: 0.95
            frequency_penalty: 0.0
            presence_penalty: 0.0
            max_tokens: 2048
            stream: true
        vlm_verification:
          frames: 1
          vlm:
            endpoint: "${endpoints.0.url}"
            model: "${endpoints.0.model}"
          system_prompt: |
            You are an expert vision model tasked with answering multiple choice questions
            about images. Analyze the image carefully and select the single best answer from
            the provided options. Respond with ONLY a single letter (A, B, C, or D)
            corresponding to your answer. Do not include any explanation or additional text.
          parameters:
            retry: 0
            temperature: 0.0
            top_p: 1.0
            frequency_penalty: 0.0
            max_tokens: 10
            stream: false
