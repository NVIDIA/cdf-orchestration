<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="600" viewBox="0 0 1360 600" role="img" aria-labelledby="title description">
  <title id="title">SMT defect image generation workflow</title>
  <desc id="description">Simulation renders component images. Augmentation calls image-edit to create golden images, which are grouped by class and passed to AnomalyGen. Prepared datasets can enter at input preparation for defect-only mode. AnomalyGen uses a VLM to propose and judge masks, then generates defect images. Golden images and defect images are saved to S3. Solid arrows show data flow and dashed arrows show calls to model services.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#41634f"/>
    </marker>
    <marker id="service-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #172b24; }
      .title { font-size: 28px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #50615a; }
      .task { font-family: "DejaVu Sans Mono", monospace; font-size: 14px; fill: #50615a; }
      .input { fill: #f7f9f8; stroke: #cad6cf; stroke-width: 1.5; }
      .service { fill: #eaf0f8; stroke: #b8c6d9; stroke-width: 1.5; }
      .stage { fill: #ffffff; stroke: #8eaa98; stroke-width: 2; }
      .result { fill: #edf5ed; stroke: #8eaa98; stroke-width: 1.5; }
      .flow { fill: none; stroke: #41634f; stroke-width: 2.5; marker-end: url(#arrow); }
      .call { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#service-arrow); }
    </style>
  </defs>
  <rect width="1360" height="600" fill="#ffffff"/>
  <text x="44" y="43" class="title">SMT defect image generation</text>
  <text x="44" y="73" class="body">Simulation → Golden images → Defect images</text>

  <rect x="44" y="112" width="276" height="80" rx="12" class="input"/>
  <text x="64" y="145" class="heading">Scene in S3</text>
  <text x="64" y="173" class="small">USD scene or scene ZIP</text>
  <rect x="376" y="112" width="276" height="80" rx="12" class="service"/>
  <text x="396" y="145" class="heading">Image-edit service</text>
  <text x="396" y="173" class="small">Sim2real inference</text>
  <rect x="708" y="112" width="276" height="80" rx="12" class="input"/>
  <text x="728" y="145" class="heading">Prepared images</text>
  <text x="728" y="173" class="small">Defect-only input from S3</text>
  <rect x="1040" y="112" width="276" height="80" rx="12" class="service"/>
  <text x="1060" y="145" class="heading">VLM endpoint</text>
  <text x="1060" y="173" class="small">Mask proposal and judging</text>

  <path d="M182 192 V242" class="flow"/>
  <path d="M514 192 V242" class="call"/>
  <path d="M846 192 V242" class="flow"/>
  <path d="M1178 192 V242" class="call"/>

  <rect x="44" y="246" width="276" height="150" rx="14" class="stage"/>
  <text x="64" y="285" class="heading">Simulation</text>
  <text x="64" y="322" class="body">Render component images</text>
  <text x="64" y="368" class="task">image_generation</text>

  <rect x="376" y="246" width="276" height="150" rx="14" class="stage"/>
  <text x="396" y="285" class="heading">Augmentation</text>
  <text x="396" y="322" class="body">Create golden images</text>
  <text x="396" y="368" class="task">augmentation</text>

  <rect x="708" y="246" width="276" height="150" rx="14" class="stage"/>
  <text x="728" y="285" class="heading">Input preparation</text>
  <text x="728" y="322" class="body">Prepare class folders</text>
  <text x="728" y="368" class="task">anomaly_package</text>

  <rect x="1040" y="246" width="276" height="150" rx="14" class="stage"/>
  <text x="1060" y="285" class="heading">AnomalyGen</text>
  <text x="1060" y="322" class="body">Generate defect images</text>
  <text x="1060" y="368" class="task">anomaly_generation</text>

  <path d="M320 321 H372" class="flow"/>
  <path d="M652 321 H704" class="flow"/>
  <path d="M984 321 H1036" class="flow"/>

  <path d="M514 396 V454" class="flow"/>
  <rect x="44" y="458" width="608" height="64" rx="14" class="result"/>
  <text x="64" y="498" class="heading">Golden images saved to S3</text>

  <path d="M1178 396 V454" class="flow"/>
  <rect x="708" y="458" width="608" height="64" rx="14" class="result"/>
  <text x="728" y="498" class="heading">Defect images saved to S3</text>

  <path d="M44 566 H92" class="flow"/>
  <text x="102" y="572" class="small">Data flow</text>
  <path d="M237 566 H285" class="call"/>
  <text x="295" y="572" class="small">Service call</text>
  <rect x="446" y="557" width="30" height="18" rx="4" class="input"/>
  <text x="486" y="572" class="small">Input in S3</text>
  <rect x="632" y="557" width="30" height="18" rx="4" class="service"/>
  <text x="672" y="572" class="small">Model service</text>
  <rect x="842" y="557" width="30" height="18" rx="4" class="stage"/>
  <text x="882" y="572" class="small">Workflow stage (Airflow task)</text>
  <rect x="1175" y="557" width="30" height="18" rx="4" class="result"/>
  <text x="1215" y="572" class="small">Output in S3</text>
</svg>
